#
# The iOS receiver core. It has to live inside CabinPlay-Relay's Rust workspace
# because the protocol crates inherit their dependency versions from
# `[workspace.dependencies]`; `scripts/build-rust-ios.sh` builds it with
# `cargo build -p oxp-ios --target aarch64-apple-ios`.

[package]
name = "oxp-ios"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "oxp_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
carplay-airplay.workspace = true
carplay-iap2.workspace = true
libc.workspace = true
