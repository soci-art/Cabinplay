name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  rust:
    name: rust-tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc -V
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: oxp-clink tests
        run: |
          set -o pipefail
          cd src/OpenXPlay-Stream/rust
          if ! cargo test -p oxp-clink 2>&1 | tee /tmp/rust.log; then
            echo "::error::$(tail -n 20 /tmp/rust.log | tr '\n' ' ' | cut -c1-800)"
            exit 1
          fi
      - name: rust builds
        run: |
          cd src/OpenXPlay-Stream/rust && cargo build -p oxp-clink-ios --release --target aarch64-apple-ios
          cd ../../OpenXPlay-Relay/rust && cargo build -p oxp-ios --release --target aarch64-apple-ios

  ios:
    name: ios-simulator-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc -V
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew install xcodegen
      - name: Build app (no signing)
        run: |
          set -o pipefail
          ROOT="$GITHUB_WORKSPACE"
          (
            cd "$ROOT/src/OpenXPlay-Relay/rust" && cargo build -p oxp-ios --release --target aarch64-apple-ios-sim
            cd "$ROOT/src/OpenXPlay-Stream/rust" && cargo build -p oxp-clink-ios --release --target aarch64-apple-ios-sim
            mkdir -p "$ROOT/OpenXPlay-iOS/generated"
            cp "$ROOT/src/OpenXPlay-Stream/rust/target/aarch64-apple-ios-sim/release/liboxp_clink_ios.a" "$ROOT/OpenXPlay-iOS/generated/"
            cp "$ROOT/src/OpenXPlay-Relay/rust/target/aarch64-apple-ios-sim/release/liboxp_ios.a" "$ROOT/OpenXPlay-iOS/generated/"
            cd "$ROOT/OpenXPlay-iOS/generated" && libtool -static -o liboxp_all.a liboxp_ios.a liboxp_clink_ios.a
            cp "$ROOT/src/OpenXPlay-Relay/rust/oxp-ios/include/oxp_ios.h" .
            cp "$ROOT/src/OpenXPlay-Stream/rust/oxp-clink-ios/include/oxp_clink_ios.h" .
            cd "$ROOT/OpenXPlay-iOS" && xcodegen generate
            xcodebuild -project OpenXPlay.xcodeproj -scheme OpenXPlay -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          ) 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            echo "::error::$(grep -E 'error:|error ' /tmp/build.log | head -n 4 | tr '\n' ' ' | cut -c1-900)"
            exit $code
          fi
