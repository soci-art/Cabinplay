# Codemagic cloud build for OpenXPlay iOS (iPhone direct-connect receiver).
# Builds an UNSIGNED .ipa on a Codemagic Mac: first the Rust receiver core
# (oxp-ios, aarch64-apple-ios), then the SwiftUI app via XcodeGen.
# No Apple account or signing secret is required; sign the IPA yourself.
# Place this file at the repository root (next to OpenXPlay-iOS/ and src/).
workflows:
  ios-unsigned:
    name: OpenXPlay iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install Rust toolchain
        script: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-apple-ios
          cargo --version
      - name: Build Rust receiver core for iOS
        script: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd OpenXPlay-iOS
          ./scripts/build-rust-ios.sh
          ls -lh generated/
      - name: Generate Xcode project
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd OpenXPlay-iOS
          xcodegen generate
      - name: Build unsigned app
        script: |
          cd OpenXPlay-iOS
          xcodebuild -project OpenXPlay.xcodeproj \
            -scheme OpenXPlay \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Check app bundle contents
        script: |
          APP="OpenXPlay-iOS/build/Build/Products/Release-iphoneos/OpenXPlay.app"
          ls -lh "$APP"
          echo "--- identity files in bundle ---"
          find "$APP" -name "identity.pk8" -o -name "certificate.p7b"
      - name: Package unsigned IPA
        script: |
          mkdir -p Payload
          cp -r "OpenXPlay-iOS/build/Build/Products/Release-iphoneos/OpenXPlay.app" Payload/
          zip -r OpenXPlay-unsigned.ipa Payload
    artifacts:
      - OpenXPlay-unsigned.ipa
