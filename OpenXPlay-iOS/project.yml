name: OpenXPlay
options:
  bundleIdPrefix: org.openxplay
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: YES
targets:
  OpenXPlay:
    type: application
    platform: iOS
    sources:
      - path: OpenXPlay
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openxplay.receiver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: OpenXPlay/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenXPlay.entitlements
        OTHER_LDFLAGS: ["-lc++", "-lz", "-loxp_all"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/generated"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/generated", "$(SRCROOT)/OpenXPlay/LocalCarPlay"]
        SWIFT_OBJC_BRIDGING_HEADER: OpenXPlay/OpenXPlay-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework
