name: CabinPlay
options:
  bundleIdPrefix: top.cabinplay
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.4"
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: YES
targets:
  CabinPlay:
    type: application
    platform: iOS
    sources:
      - path: CabinPlay
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.cabinplay.yyds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: CabinPlay/Info.plist
        CODE_SIGN_ENTITLEMENTS: CabinPlay.entitlements
        OTHER_LDFLAGS: ["-lc++", "-lz", "-loxp_clink_ios"]
        # 车标 PNG 必须原样进包：Xcode 默认会把散装 .png 改写成苹果私有
        # 格式（CgBI），尺寸字段位置都变了，接收端按标准 PNG 头读尺寸
        # 会读错、整段 oem 图标被跳过（2026-11-27 实证）。关掉压缩改写。
        COMPRESS_PNG_FILES: NO
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/generated"]
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/generated", "$(SRCROOT)/CabinPlay/LocalCarPlay"]
        SWIFT_OBJC_BRIDGING_HEADER: CabinPlay/CabinPlay-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: UniformTypeIdentifiers.framework

  # 单元测试：CarLinkFlow 是纯逻辑（不依赖 SwiftUI/网络），最值得先测住。
  CabinPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CabinPlayTests
    dependencies:
      - target: CabinPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.cabinplay.yyds.tests
        GENERATE_INFOPLIST_FILE: YES
